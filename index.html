<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootCapture</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#667085; --line:#d9dee7; --go:#0f766e; --warn:#b45309; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Noto Sans KR","PingFang SC",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:16px 16px 40px; }
  h1 { font-size:22px; margin:8px 0 2px; } h2 { font-size:18px; margin:18px 0 6px; }
  p, li { color:var(--mute); margin:6px 0; } ol { padding-left:20px; margin:6px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  button, .btn { display:block; width:100%; padding:13px; margin:8px 0; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font:inherit; font-weight:600; text-align:center; cursor:pointer; }
  button.go { background:var(--go); border-color:var(--go); color:#fff; } button:disabled { opacity:.45; }
  input[type=text] { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  canvas { width:100%; height:auto; display:block; border-radius:10px; background:#111; touch-action:none; }
  .stage { position:relative; } .stage video { width:100%; display:block; border-radius:10px; background:#111; }
  .stage canvas.ov { position:absolute; inset:0; height:100%; background:transparent; pointer-events:none; }
  .tilt { font-weight:700; } .ok { color:var(--go); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; } td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; color:var(--mute); font-weight:400; }
  .lang { display:flex; gap:6px; justify-content:flex-end; } .lang button { width:auto; padding:4px 10px; margin:0; font-weight:400; }
  .small { font-size:13px; }
  .side { display:flex; gap:12px; align-items:center; } .side svg { flex:none; } .side ol, .side p { flex:1; min-width:0; }
  .thumbs { display:flex; gap:6px; align-items:flex-start; } .thumbs canvas { flex:1; min-width:0; }
  canvas.gl { height:min(78vw, 400px); background:#eef1f5; border:1px solid var(--line); }
  .views { display:flex; gap:6px; } .views button { padding:8px 4px; margin:8px 0 0; font-weight:400; }
  label { display:block; margin:10px 0 0; color:var(--mute); font-size:14px; } label input[type=text], label input[type=number] { margin-top:4px; }
  input[type=number] { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  .steps { display:flex; align-items:center; gap:6px; margin:6px 0 10px; } .steps span { width:26px; height:26px; border-radius:50%; background:#e4e8ee; color:var(--mute); display:grid; place-items:center; font-size:13px; font-weight:700; }
  .steps span.on { background:var(--go); color:#fff; } .steps span.done { background:#9fd3cc; color:#fff; } .steps i { flex:1; height:2px; background:#e4e8ee; }
  canvas.demo { width:54%; margin:8px auto; }
</style>
</head>
<body>
<main id="app"></main>
<script src="fit.js?v=3d4"></script>
<script src="viewer.js?v=3d4"></script>
<script src="app.js?v=3d4"></script>
</body>
</html>
